version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      sanity:
        patterns: ['sanity', '@sanity/*', 'next-sanity']
      next:
        patterns: ['next', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
