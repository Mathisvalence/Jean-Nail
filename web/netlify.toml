# Configuration Netlify du site (application « web » du monorepo).
# Dans Netlify : Base directory = (vide), Package directory = web.
# Les commandes s'exécutent depuis la racine du dépôt : on ne construit que le site,
# et le dossier publié est indiqué depuis la racine.
[build]
  command = "npm run build --workspace web"
  publish = "web/.next"

[build.environment]
  NODE_VERSION = "22"
  # Même version de npm qu'en local et en CI (champ packageManager de package.json).
  NPM_VERSION = "11.21.1"
  NEXT_PUBLIC_SANITY_PROJECT_ID = "sjigsrm6"
  NEXT_PUBLIC_SANITY_DATASET = "production"
